name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 rather than 22.04: the support app's Wayland capture
        # binds PipeWire 1.0, and 22.04 ships 0.3.48, which no longer has the
        # symbols the bindings expect.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config
          # The DeskVNC Support app: xcb for X11 capture, PipeWire for Wayland
          # capture through the desktop portal, EGL and GBM for its GL window
          # and Wayland buffers, xkbcommon for input, and clang because
          # pipewire-sys generates its bindings at build time.
          sudo apt-get install -y             libxcb1-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev             libwayland-dev libpipewire-0.3-dev libegl1-mesa-dev libgbm-dev             clang libclang-dev
          # `puttygen`, for the PuTTY key tests. Those fixtures are generated
          # at test time and deliberately never committed (no private keys in
          # this repository), so without this the tests skip instead of run.
          sudo apt-get install -y putty-tools

      - name: Install puttygen (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install putty

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (library crates)
        # Every library crate, not a subset. The agent crates are here too:
        # they were left out, and the agent plane did not work on Windows at
        # all without CI noticing. vnc-files was previously excluded,
        # so its Windows-only SSH agent code was never compiled by CI and a
        # break only surfaced during a release build.
        #
        # `deskvncviewer` is the app itself, and it is here for the same
        # reason the ACL test below is: the crate is where the commands are
        # registered, so it is where a command can be registered without a
        # grant and be refused at run time.
        #
        # `boundary` is the DeskVNC Support app, the standalone remote
        # support program in `crates/boundary-app`. Its PACKAGE NAME is
        # `boundary` and that is not its directory name, so the flag is
        # `-p boundary` and NOT `-p boundary-app`: the second one matches no
        # package, and the job stops before it has checked anything.
        run: >
          cargo clippy
          -p remote-core -p remote-pixel -p limb-core
          -p rdp-pdu -p rdp-codecs -p rdp-auth -p rdp-core
          -p vnc-core -p vnc-transport -p vnc-discovery
          -p vnc-store -p vnc-files -p vnc-input-capture
          -p ssh-transport -p ssh-core
          -p agent-lease -p agent-perception -p agent-plane -p local-pipe -p dvv
          -p orax-registry
          -p boundary-session -p boundary-codes -p boundary-platform
          -p boundary-provision -p boundary-driver -p boundary
          -p deskvncviewer
          --all-targets -- -D warnings

      - name: Test
        # The same crates as the clippy step above, and the support app
        # among them: `boundary` is `crates/boundary-app`, whose package
        # name is `boundary`. Its own tests cover the code exchange and the
        # translocated install, and nothing else runs them.
        run: >
          cargo test
          -p remote-core -p remote-pixel -p limb-core
          -p rdp-pdu -p rdp-codecs -p rdp-auth -p rdp-core
          -p vnc-core -p vnc-transport -p vnc-discovery
          -p vnc-store -p vnc-files -p vnc-input-capture
          -p ssh-transport -p ssh-core
          -p agent-lease -p agent-perception -p agent-plane -p local-pipe -p dvv
          -p orax-registry
          -p boundary-session -p boundary-codes -p boundary-platform
          -p boundary-provision -p boundary-driver -p boundary

      - name: Test (the app)
        # The app's own command list, the ACL manifest and the capability
        # file have to agree, or Tauri refuses a command at run time with
        # "not allowed by ACL" and the webview only ever sees an empty
        # answer. That happened with the whole device registry: eight
        # commands were registered but never declared, so no
        # `allow-registry-*` permission was generated and the feature was
        # dead in the shipped app while looking alive in the source.
        #
        # This crate was not in the list above, so the test that exists for
        # exactly that was never run. `src-tauri/build.rs` now enforces the
        # same invariant at build time; this runs the test as well, because
        # the test explains what to do about it.
        #
        # The WHOLE crate is tested, not just the one integration test:
        # `--test acl` selects that target and nothing else, which left the
        # two hundred and twenty nine unit tests inside `src-tauri/src/**`
        # running nowhere. They cover the command handlers, the agent plane
        # and the frame parser, and they are the only tests those have.
        run: cargo test -p deskvncviewer

  legacy-tls:
    name: legacy-tls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # PRDRDP/10 P0.6: the vendored OpenSSL backend behind `vnc-transport`'s
    # `legacy-tls` feature, off by default (V3-B). This job is deliberately
    # separate from `rust` above and scoped to `-p vnc-transport` only: it
    # is the one crate that names the feature (PRDRDP/12 §2.5's
    # `only_vnc_transport_names_openssl`), and keeping it its own job means
    # a toolchain failure here (Perl, make, or the Windows NASM path,
    # PRDRDP/11 §3.10.3) is legible on its own line rather than buried in
    # the six-crate `rust` job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # NASM is Windows MSVC only and not on the runner image (PRDRDP/11
      # §3.10.3). Without it `openssl-src` silently falls back to `no-asm`,
      # which still builds but is a different libcrypto from the other two
      # platforms, which is the exact divergence R55 vendors OpenSSL to
      # avoid. `OPENSSL_RUST_USE_NASM=1` below turns a dropped runner tool
      # into a loud build failure instead of a silent one.
      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: legacy-tls

      - name: Build (legacy-tls)
        env:
          OPENSSL_RUST_USE_NASM: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: cargo build -p vnc-transport --features legacy-tls

      - name: Test (legacy-tls)
        env:
          OPENSSL_RUST_USE_NASM: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: cargo test -p vnc-transport --features legacy-tls

      - name: Clippy (legacy-tls)
        env:
          OPENSSL_RUST_USE_NASM: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: cargo clippy -p vnc-transport --features legacy-tls --all-targets -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Every step runs inside ui/. Running `npx tsc` from the repo root finds
      # no local node_modules (deps live in ui/), so npx silently downloads the
      # unrelated `tsc` package from the registry, which is not the TypeScript
      # compiler and always exits 1.
      - run: npm ci
        working-directory: ui
      - run: npx tsc --noEmit
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui

  cloudflare-worker:
    name: Registry Worker (D1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      # Peers are resolved with --legacy-peer-deps locally too: the Cloudflare
      # plugin and vitest are pinned together in this project.
      - name: Install
        run: npm ci --legacy-peer-deps
        working-directory: cloudflare
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: cloudflare
      # Two suites: the offline schema tests (node:sqlite, no install needed)
      # and the Worker contract/security tests inside workerd with a local D1.
      - name: Tests
        run: npm test
        working-directory: cloudflare

  audit:
    name: Security audit
    runs-on: ubuntu-22.04
    # The action publishes results as a check run, which the default read-only
    # GITHUB_TOKEN cannot create ("Resource not accessible by integration").
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Accepted advisories, each with a written justification, live in
      # .cargo/audit.toml. Anything new fails the job.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# Nightly live-protocol verification.
#
# The crates carry integration suites that are gated on a real server and skip
# on CI by design (`docs/CONNECTION-AUDIT.md`, P1) — a silent skip would let
# "filed against real servers" rot into a claim nobody keeps testing. This job
# stands the servers up every night so the suites actually run:
#
#   * `ssh-core/tests/live.rs`      — dial, PTY, resize, tmux reconnect,
#     against an OpenSSH account authenticated by an ssh-agent only (the suite
#     never reads or types a password).
#   * `vnc-core/tests/interop_live.rs` — the RFB handshake against a real
#     VNC server. The suite never answers any auth challenge and skips the
#     Apple-only assertions unless the server announces Apple's
#     `RFB 003.889`, so any RFB-speaking server exercises the generic path.
#
# Every gated test still skips (green) when its server failed to come up, so a
# broken service degrades to fewer assertions rather than red noise; the
# nightly value is that when the runner is healthy, these protocols are
# continuously proven against reality.
#
# Not wired yet (need a specific network, DNS or Windows host to mean
# anything): DVV_LIVE_MARKER, DVV_LIVE_RESOLVE, DVV_LIVE_RESOLVE_IP,
# DVV_LIVE_SUBNET_SCAN — see the audit doc before extending.

name: live-protocol

on:
  schedule:
    - cron: "0 3 * * *" # nightly, before the site's monthly refresh (04:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-protocol
  cancel-in-progress: false

jobs:
  live:
    name: openssh + VNC (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the live servers and their tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssh-server \
            tmux screen xauth \
            x11vnc xvfb

      - name: Create the live SSH account and its key
        run: |
          sudo useradd -m -s /bin/bash dvvtest
          ssh-keygen -q -t ed25519 -N "" -f "$HOME/live_key"
          sudo install -d -m 700 -o dvvtest -g dvvtest /home/dvvtest/.ssh
          sudo tee /home/dvvtest/.ssh/authorized_keys > /dev/null < "$HOME/live_key.pub"
          sudo chmod 600 /home/dvvtest/.ssh/authorized_keys
          sudo chown dvvtest:dvvtest /home/dvvtest/.ssh/authorized_keys

      - name: Start sshd on :2222
        run: |
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222

      - name: Load the live key into ssh-agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/live_key"
          # The tests authenticate by agent only (SSH_AUTH_SOCK); persisting
          # the socket is what makes that true inside later steps too.
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Smoke-test sshd before spending test time on it
        run: |
          ssh -q -o StrictHostKeyChecking=no -p 2222 \
            dvvtest@127.0.0.1 'echo sshd-live-ok'

      - name: Probe - does a tmux server survive its client disconnect
        run: |
          # The reconnect suite's whole subject. Detached start, disconnect,
          # then ask again from a fresh connection.
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux new-session -A -d -s livetest-probe; tmux list-sessions'
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux has-session -t livetest-probe && echo TMUX_SERVER_SURVIVED'
          # Clean the probe session up so the suites below start pristine.
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux kill-session -t livetest-probe || true'

          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux kill-session -t livetest-probe || true'

      - name: Probe - tmux survival in the shell-typed foreground shape
        run: |
          # The crate does not run `tmux new-session -d`; it opens a login
          # shell and *types* the foreground attach into it. Reproduce that
          # shape with the same TERM the PTY request carries. `timeout` cuts
          # the ssh client after 8s, which is exactly the hang-up class the
          # reconnect suite exercises (a client that dies with the link).
          timeout --signal=KILL 8 ssh -tt -o StrictHostKeyChecking=no -p 2222 \
            dvvtest@127.0.0.1 \
            'TERM=xterm-256color tmux new-session -A -s shapetest' \
            < /dev/null > /tmp/shape-attach.log 2>&1 || true
          echo '--- attach log ---'; cat /tmp/shape-attach.log
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux list-sessions 2>&1; pgrep -a tmux || echo no-tmux-process'
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux kill-session -t shapetest 2>/dev/null || true'

      - name: Probe - the crate's full shape (typed attach, EOF drop, crate probe script)
        run: |
          # Reproduce the crate end to end in bash: login shell, attach typed
          # exactly as pty.rs types it (leading space, CR terminator), EOF on
          # stdin the way a russh disconnect ends the channel — then ask with
          # the crate's own generated probe script via a PTY-less exec.
          mkfifo /tmp/shape.fifo
          ssh -tt -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            > /tmp/shape.out 2>&1 < /tmp/shape.fifo &
          ssh_pid=$!
          exec 9> /tmp/shape.fifo
          sleep 3
          printf ' TERM=xterm-256color tmux new-session -A -s shaped\r' >&9
          sleep 3
          exec 9>&-
          wait $ssh_pid || true
          echo '--- first-connection output ---'
          tail -c 600 /tmp/shape.out
          echo '--- verdict via the crate probe script ---'
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'sh -c "if command -v tmux >/dev/null 2>&1; then if tmux has-session -t shaped 2>/dev/null; then echo tmux:present; else echo tmux:absent; fi; else echo tmux:missing; fi; echo end"'
          echo '--- verdict via the plain exit status ---'
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux has-session -t shaped && echo SHAPED_SURVIVED || echo SHAPED_DIED'
          ssh -q -o StrictHostKeyChecking=no -p 2222 dvvtest@127.0.0.1 \
            'tmux kill-session -t shaped 2>/dev/null || true'
          rm -f /tmp/shape.fifo

      - name: Start the VNC server (Xvfb + x11vnc) on :5901
        run: |
          # x11vnc rather than TigerVNC: it speaks the RFB handshake the suite
          # probes (offering VNC auth) and takes its password on the command
          # line, which skips the tigervncpasswd binary-name drift between
          # Ubuntu releases entirely.
          Xvfb :99 -screen 0 1024x768x24 &
          for _ in $(seq 1 30); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.5
          done
          nohup x11vnc -display :99 -rfbport 5901 -passwd vnc-live-password \
            -forever -shared -quiet > /tmp/x11vnc.log 2>&1 &
          # The suite would politely skip if the port stayed closed; here a
          # silent skip would silently drop the server from the nightly, so
          # the step must fail instead.
          for _ in $(seq 1 30); do
            if (exec 3<>"/dev/tcp/127.0.0.1/5901") 2>/dev/null; then
              echo "VNC is listening on 5901"
              break
            fi
            sleep 1
          done
          (exec 3<>"/dev/tcp/127.0.0.1/5901") || { echo "VNC never came up"; cat /tmp/x11vnc.log; exit 1; }

      - name: Run the live SSH suite (PTY, resize, tmux reconnect)
        env:
          DVV_LIVE_SSH: dvvtest@127.0.0.1:2222
          RUST_LOG: debug
          RUST_BACKTRACE: "1"
        run: cargo test -p ssh-core --test live -- --nocapture

      - name: Run the live VNC suite (real RFB handshake)
        env:
          DVV_LIVE_VNC: 127.0.0.1:5901
          RUST_BACKTRACE: "1"
        run: cargo test -p vnc-core --test interop_live -- --nocapture
